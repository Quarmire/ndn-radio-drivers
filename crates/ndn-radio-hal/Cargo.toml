[package]
name = "ndn-radio-hal"
description = "The data-plane radio HAL contract for ndn-rs: the bearer-agnostic TxIntent, the 802.11 McsDescriptor/policy resolution, the inject/capture frame types, and the FrameIo/WifiRadio traits the radio faces are built on. Pure types + traits, no I/O."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.scope]
classification = "spec"

[features]
# ★ The ONLY way, besides `NDN_RF_UNRESTRICTED`, to mint an `RfAuthority` — i.e. to reach the raw
# chip TXAGC axis, off the regulatory scale. Off by default so no library code can construct one:
# the regulatory ceiling is enforced by the type system rather than by discipline. Bench examples
# that need it declare it in `required-features`.
bench = []

[dependencies]
ndn-transport = { workspace = true }
# The link-timestamp vocabulary (LinkStamp/ClockDomainId/LatchPoint) lives in
# the no_std named-time core; this std crate depends on it to put an
# `Option<LinkStamp>` on CapturedFrame. Direction is std -> no_std (valid);
# both crates are spec. See ADR 0007.
ndn-time      = { workspace = true }
bytes         = { workspace = true, features = ["std"] }
async-trait   = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
# docs.rs builds with every feature so the full API surface (incl. feature-
# gated items) renders, and passes --cfg docsrs so `#[doc(cfg(...))]` shows the
# feature each gated item needs.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
