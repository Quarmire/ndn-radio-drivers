# usbmon capture parser for the RTL8733BU TX-enable hunt. Pure std — builds on the
# OPi or the Mac. Reads a `cat /sys/kernel/debug/usb/usbmon/<bus>u` text capture and
# reconstructs the Realtek VENQT register-write + bulk-transfer sequence, so the
# vendor driver's TX-enable writes can be diffed against ours.
[workspace]

[package]
name = "rtl8733b-usbmon"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "usbmon"
path = "src/main.rs"

[dependencies]
