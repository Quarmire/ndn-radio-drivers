[package]
name = "ndn-radio-drivers"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MPL-2.0"
description = "Userspace USB Wi-Fi monitor-mode driver backends (RTL8812EU/8822E, RTL8821CU, MT7612U, RTL8812AU, RTL8731BU/8733BU) over the ndn-radio-hal contract."

[dependencies]
# In-repo since P2/D5: the radio campaign's foundation crates live here now,
# not in ndn-rs crates/core (history there up to df454d63).
ndn-radio-hal = { path = "crates/ndn-radio-hal" }
ndn-frame-io  = { path = "crates/ndn-frame-io" }
# RefBelief (#75) parsed from mesh timing beacons.
ndn-time      = { workspace = true }
ndn-transport = { workspace = true }
async-trait = "0.1"
tracing = "0.1"
bytes = { version = "1", features = ["std"] }
tokio = { version = "1", features = ["sync", "rt", "net", "time", "rt-multi-thread", "macros"] }
rusb = "0.9"
libc = "0.2"
libusb1-sys = "0.7"
# BW16 (RTL8720DN) serial-bridged backend — optional (host<->board over USB-serial).
serialport = { version = "4", optional = true, default-features = false }

[features]
default = []
# The BW16 (RTL8720DN) serial-bridged monitor-mode backend.
bw16 = ["dep:serialport"]
# The Waveshare USB-TO-LoRa (SX1262) serial-bridged sub-GHz backend (raw libc termios, no serialport).
lora = []

# BW16 examples need the `bw16` backend — gate them so `cargo build --examples`
# (default features) skips them instead of failing on the unresolved import.
[[example]]
name = "bw16_probe"
required-features = ["bw16"]

[[example]]
name = "bw16_probe_rate"
required-features = ["bw16"]

[[example]]
name = "bw16_txpower"
required-features = ["bw16"]

[[example]]
name = "bw16_knobs"
required-features = ["bw16"]

[[example]]
name = "lora_link"
required-features = ["lora"]

# Same `lora` gate as lora_link above — it imports `LoraSerialBackend`, which the feature gates.
# Without this entry cargo built it unconditionally, so `cargo test -p ndn-radio-drivers` failed to
# compile and the crate's tests never ran at all.
[[example]]
name = "lora_contention"
required-features = ["lora"]

[[example]]
name = "ndn_dataplane_test"
required-features = ["lora"]

[[example]]
name = "lora_dfu"
required-features = ["lora"]

# The two examples that consumed ndn-ext crates (lora_cognition,
# named_time_node) moved to ndn-ext in P2 — that dev-dep back-edge was the
# repo cycle ext <-> radio-drivers; the graph is a DAG again:
# ndn-rs <- ndn-radio-drivers <- ndn-ext.

[workspace]
members = [
    "crates/ndn-radio-hal",
    "crates/ndn-frame-io",
    "crates/ndn-env",
]

# The moved crates keep their original licensing (they came from ndn-rs, which
# is MIT OR Apache-2.0); the root driver package stays MPL-2.0 explicitly.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
# Same policy as ndn-rs: unsafe-free by default; the OS-I/O boundary
# (ndn-frame-io's AF_PACKET backend, the USB backends) opts back in with
# scoped allows at the module that owns the raw-socket/FFI boundary.
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[workspace.dependencies]
ndn-radio-hal = { path = "crates/ndn-radio-hal" }
ndn-transport = { git = "https://github.com/Quarmire/ndn-rs", tag = "v0.1.0-alpha.3" }
ndn-time      = { git = "https://github.com/Quarmire/ndn-rs", tag = "v0.1.0-alpha.3", default-features = false }
bytes       = { version = "1", default-features = false }
async-trait = "0.1"
tokio       = { version = "1", default-features = false }
libc        = "0.2"
proptest    = "1"
