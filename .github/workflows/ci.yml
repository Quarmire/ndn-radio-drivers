name: CI — ndn-radio-drivers

# First CI for this repo (P1): clippy + host unit tests.
#
# ndn-radio-drivers depends on ndn-rs (radio-hal / frame-io / time / transport)
# and, in dev-dependencies, ndn-ext (time driver, radio cognition) through `../`
# path deps, so every job checks those repos out as siblings (ndn-rs/ + ndn-ext/
# next to ndn-radio-drivers/), mirroring ndn-ext's own CI layout. Unlike the
# sibling workflows, the sibling checkouts here are pinned to known-good SHAs so
# a sibling push cannot redden this repo's gate. When the repos are released,
# switch the path deps to { git, tag } and drop the checkouts.
#
# Deliberately NOT built here:
#   - examples/ — 70+ hardware probe binaries that need a radio on the USB bus
#     to be useful; building them would dominate CI time for zero signal.
#   - firmware/* — independent embedded sub-workspaces (thumbv8m / Xtensa /
#     nRF54) that need their own cross toolchains.
#
# Toolchain: no rust-toolchain.toml here — jobs use the runner's stable, which
# satisfies edition 2024 / rust-version 1.90.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    working-directory: ndn-radio-drivers

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: clippy (lib + bins)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: ndn-radio-drivers }
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/ndn-rs
          ref: 74beb638d3ba7c5654140f827010c6c22b57227f # pinned sibling; bump deliberately
          path: ndn-rs
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/ndn-ext
          ref: 6de852365eb73c0c5007bf4e26069d0afb8751a6 # pinned sibling; bump deliberately
          path: ndn-ext
      - name: Install system dependencies (libusb)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libusb-1.0-0-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ndn-radio-drivers
          shared-key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Plain clippy, not `-D warnings`: the lib carries pre-existing lints
      # (needless_range_loop / result_large_err and friends in the Realtek
      # backends). Escalate to `-- -D warnings` once those are burned down.
      # Same feature matrix as the test job so the serial-radio / lora / bench
      # code paths are linted too, not just the default-feature surface.
      - name: clippy (lib + bins)
        run: cargo clippy -p ndn-radio-drivers --lib --bins --features serial-radio,lora,bench

  test:
    name: host tests (lib + integration, feature matrix)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: ndn-radio-drivers }
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/ndn-rs
          ref: 74beb638d3ba7c5654140f827010c6c22b57227f # pinned sibling; bump deliberately
          path: ndn-rs
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/ndn-ext
          ref: 6de852365eb73c0c5007bf4e26069d0afb8751a6 # pinned sibling; bump deliberately
          path: ndn-ext
      # The NDN_* surface gate (#81): every env::var("NDN_…") read in the
      # checked-out repos must be either registered in crates/ndn-env/src/lib.rs
      # or frozen in crates/ndn-env/unregistered-baseline.txt. The scan is scoped
      # to the siblings this job already checks out (repos not checked out here
      # are skipped), so the runner's workspace root is passed explicitly.
      - name: env census (NDN_* surface gate)
        run: python3 tools/env_census.py "${{ github.workspace }}"
      - name: Install system dependencies (libusb)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libusb-1.0-0-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ndn-radio-drivers
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # `--lib --tests` (not plain `cargo test`) runs the unit + integration
      # suites WITHOUT compiling examples (the hardware probe binaries excluded
      # above by design). The feature matrix mirrors the developer gate:
      #   serial-radio (BW16/C5), lora (SX12xx), bench (per-rung bring-up examples).
      # (The old `tier0_golden` gate was removed with the retired in-frame filter.)
      - name: unit + integration tests (feature matrix)
        run: cargo test -p ndn-radio-drivers --lib --tests --features serial-radio,lora,bench
