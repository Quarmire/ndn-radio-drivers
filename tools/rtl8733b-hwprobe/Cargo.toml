# Standalone rusb-only hardware probe for the RTL8731BU/8733BU — the M4.5 RE bench.
# Builds natively on the OPi (nix-shell -p cargo rustc pkg-config libusb1) against
# the real f72b; carries the SAME VENQT reg-I/O + M1–M4 logic as the driver, so a
# sequence verified here ports back into src/libusb_rtl8733b.rs verbatim.
[workspace]

[package]
name = "rtl8733b-hwprobe"
version = "0.1.0"
edition = "2021"

[dependencies]
rusb = "0.9"
