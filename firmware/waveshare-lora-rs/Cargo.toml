# Standalone no_std firmware for the Waveshare USB-LoRa dongle (GD32F103C8 + SX1262).
# Replaces the closed Waveshare stream firmware with open Rust: standard LoRa + the named-radio
# serial bridge protocol + full SX1262 knob exposure. Flashed whole via ST-Link/openocd at 0x08000000
# (no bootloader — SWD reflashes). Target thumbv7m-none-eabi (Cortex-M3). Not in the host workspace.
[workspace]

[package]
name = "waveshare-lora-rs"
version = "0.1.0"
edition = "2021"
description = "Open Rust firmware for the Waveshare USB-LoRa dongle (GD32F103C8 + SX1262)"
license = "MIT OR Apache-2.0"

# ── Embedded dependencies, DEVICE TARGET ONLY ───────────────────────────────────────────────────
#
# Under `cfg(target_os = "none")` rather than plain `[dependencies]` so that
# `cargo test --target <host> --lib` can build `src/lib.rs` and run the tests for `capture` — the
# RX-timestamp wrap arithmetic, the edge-attribution rule and the `stamp_kind` byte, all of which
# are contracts with the host driver and none of which needs a GD32 to check. Before this split
# `cargo test` could not even start: `cortex-m-rt` and the `stm32f1` PAC build for no hosted target.
#
# This changes nothing about the firmware build: `.cargo/config.toml` pins the target to
# `thumbv7m-none-eabi`, which IS `target_os = "none"`.
[target.'cfg(target_os = "none")'.dependencies]
cortex-m = "0.7"
cortex-m-rt = "0.7"
panic-halt = "0.2"
embedded-hal = "0.2"
nb = "1"
# Reuse the no_std NDN forwarder's data-centric primitives on the MCU: fnv1a64 (the #44 shared
# name-hash keyspace) and the fixed-capacity Content Store. `default-features = false` selects the
# allocation-free path (see ndn-embedded's `forwarder` feature) so this no-heap binary links clean.
ndn-embedded = { path = "../../../ndn-embedded/crates/ndn-embedded", default-features = false, features = ["cs"] }

[target.'cfg(target_os = "none")'.dependencies.stm32f1xx-hal]
version = "0.10"
features = ["stm32f103", "rt", "medium"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
debug = true
