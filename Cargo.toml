[package]
name = "ndn-radio-drivers"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MPL-2.0"
description = "Userspace USB Wi-Fi monitor-mode driver backends (RTL8812EU/8822E, RTL8821CU, MT7612U, RTL8812AU, RTL8731BU/8733BU) over the ndn-radio-hal contract."

[dependencies]
# In-repo since P2/D5: the radio campaign's foundation crates live here now,
# not in ndn-rs crates/core (history there up to df454d63).
ndn-radio-hal = { path = "crates/ndn-radio-hal" }
ndn-frame-io  = { path = "crates/ndn-frame-io" }
# RefBelief (#75) parsed from mesh timing beacons.
ndn-time      = { path = "../ndn-rs/crates/core/ndn-time", default-features = false }
ndn-transport = { path = "../ndn-rs/crates/core/ndn-transport" }
async-trait = "0.1"
tracing = "0.1"
bytes = { version = "1", features = ["std"] }
tokio = { version = "1", features = ["sync", "rt", "net", "time", "rt-multi-thread", "macros"] }
rusb = "0.9"
libc = "0.2"
libusb1-sys = "0.7"
# BW16 (RTL8720DN) serial-bridged backend — optional (host<->board over USB-serial).
serialport = { version = "4", optional = true, default-features = false }

[features]
default = []
# Expose individual bring-up rungs as `pub` (else `pub(crate)`) so per-rung
# examples/benches can drive one step in isolation. See the `step!` macro in lib.rs.
bench = []
# The serial-bridged 802.11 monitor-mode backend (SerialRadioBackend / Esp32SerialBackend), speaking the
# `[4E 44 …]` ND wire protocol to a BW16 (RTL8720DN) or an ESP32-C5 over USB-serial.
serial-radio = ["dep:serialport"]
# The Waveshare USB-TO-LoRa (SX1262) serial-bridged sub-GHz backend (raw libc termios, no serialport).
lora = []

# Feature-gated examples. Both import `LoraSerialBackend`, which the `lora`
# feature provides; gating them keeps `cargo build --examples` (default
# features) and `cargo test -p ndn-radio-drivers` from compiling them
# unconditionally and failing on the unresolved import. (The rest of examples/
# is excluded from CI by design.)
[[example]]
name = "lora_link"
required-features = ["lora"]

[[example]]
name = "ndr_node_report"
required-features = ["lora"]

[workspace]
members = [
    "crates/ndn-radio-hal",
    "crates/ndn-frame-io",
    "crates/ndn-env",
]

# The moved crates keep their original licensing (they came from ndn-rs, which
# is MIT OR Apache-2.0); the root driver package stays MPL-2.0 explicitly.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
# Same policy as ndn-rs: unsafe-free by default; the OS-I/O boundary
# (ndn-frame-io's AF_PACKET backend, the USB backends) opts back in with
# scoped allows at the module that owns the raw-socket/FFI boundary.
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[workspace.dependencies]
ndn-radio-hal = { path = "crates/ndn-radio-hal" }
ndn-transport = { path = "../ndn-rs/crates/core/ndn-transport" }
ndn-time      = { path = "../ndn-rs/crates/core/ndn-time", default-features = false }
bytes       = { version = "1", default-features = false }
async-trait = "0.1"
tokio       = { version = "1", default-features = false }
libc        = "0.2"
proptest    = "1"
