# Standalone no_std firmware for the Seeed XIAO nRF54L15 + Semtech LR2021 (LoRa Gen 4 / "LoRa Plus").
# The MAC validation platform: unlike commodity Wi-Fi this gives us hardware-scheduled TX and hardware
# RX timestamping (nRF54L15 DPPI + TIMER, no CPU in the loop), full frame control (no 802.11 header),
# and FLRC at up to 2.6 Mbit/s so slot/lease structure is testable at a realistic timescale.
# See ndn-face-monitor-wifi/docs/named-filter-mac-redesign.md §8.5. Not in the host workspace.
[workspace]

[package]
name = "lr2021-nrf54l15-rs"
version = "0.1.0"
edition = "2021"
description = "Open Rust firmware for the XIAO nRF54L15 + LR2021 named-radio MAC testbed"
license = "MIT OR Apache-2.0"

[dependencies]
cortex-m = { version = "0.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7"
embassy-executor = { version = "0.9", features = ["arch-cortex-m", "executor-thread"] }
embassy-time = { version = "0.5", features = ["defmt"] }
embassy-nrf = { version = "0.11", features = ["nrf54l15-app-s", "time-driver-grtc", "gpiote", "defmt"] }
# The GRTC time driver runs at 1 MHz; embassy-time-driver's DEFAULT feature also selects
# tick-hz-32_768, and two tick rates make `TICK_HZ` a duplicate definition. Pulling it in
# directly with default-features=false leaves GRTC's 1 MHz as the only tick rate — which is
# also exactly the 1 µs resolution the MAC clock wants (see src/timing.rs).
embassy-time-driver = { version = "0.2", default-features = false }
embassy-futures = "0.1"
embedded-hal = "1.0"
embedded-hal-async = "1.0"
embedded-io-async = "0.7"
embedded-hal-bus = { version = "0.3", features = ["async"] }
# Vendored from crates.io 0.13.1 with one local patch — see README "Vendored LR2021 driver".
lr2021 = { path = "vendor/lr2021", features = ["defmt"] }
# The SAME no_std NDN data plane the Waveshare/Heltec nodes run — shared by path, not copied, so
# name-hash/filter/dedup semantics cannot drift between the nodes that must interoperate.
ndn-embedded = { path = "../../../ndn-embedded/crates/ndn-embedded", default-features = false, features = ["cs"] }
defmt = "1"
defmt-rtt = "1"
panic-probe = { version = "1", features = ["print-defmt"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
debug = true
